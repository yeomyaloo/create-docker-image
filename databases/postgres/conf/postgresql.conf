# config_file 로 지정하면 PGDATA 안의 기본 postgresql.conf 는 무시된다 → 필요한 값은 여기 모두 적는다.
listen_addresses = '*'          # 기본값(localhost)이면 컨테이너 밖에서 접속 불가
port = 5432
max_connections = 100

shared_buffers = 128MB
work_mem = 4MB

timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'

# 1초 이상 걸린 쿼리 로그 (docker logs 로 확인)
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d '
