<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="④ AWS ECR 푸시와 ECS Fargate 실행">
  <style>
    .t{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1f2937}
    .title{font-size:20px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:12px;fill:#4b5563}
    .lbl{font-size:11.5px;fill:#475569;font-weight:700}
    .m{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:11.5px;fill:#0f172a}
    .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="960" height="540" rx="12" fill="#ffffff"/>
  <text x="32" y="40" class="t title">④ AWS: ECR에 올리고 ECS Fargate로 실행</text>

  <!-- 빌드/푸시 라인 -->
  <rect x="32" y="72" width="200" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="132" y="100" text-anchor="middle" class="t h">GitHub Actions</text>
  <text x="132" y="124" text-anchor="middle" class="m">build-push-ecr.yml</text>
  <text x="132" y="146" text-anchor="middle" class="t s">main 푸시 / 수동 실행</text>
  <text x="132" y="166" text-anchor="middle" class="t s">matrix: DB 5종</text>
  <path d="M232,127 H268" class="arrow"/>

  <rect x="270" y="72" width="190" height="110" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="365" y="100" text-anchor="middle" class="t h">IAM Role (OIDC)</text>
  <text x="365" y="124" text-anchor="middle" class="t s">장기 액세스 키 없음</text>
  <text x="365" y="146" text-anchor="middle" class="m">AssumeRoleWith</text>
  <text x="365" y="164" text-anchor="middle" class="m">WebIdentity</text>
  <path d="M460,127 H496" class="arrow"/>

  <rect x="498" y="72" width="170" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="583" y="100" text-anchor="middle" class="t h">docker buildx</text>
  <text x="583" y="124" text-anchor="middle" class="m">linux/amd64</text>
  <text x="583" y="144" text-anchor="middle" class="m">linux/arm64</text>
  <text x="583" y="166" text-anchor="middle" class="t s">빌드와 동시에 --push</text>
  <path d="M668,127 H704" class="arrow"/>

  <rect x="706" y="72" width="222" height="110" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="817" y="100" text-anchor="middle" class="t h">Amazon ECR</text>
  <text x="817" y="122" text-anchor="middle" class="m">cdi/postgres</text>
  <text x="817" y="142" text-anchor="middle" class="m">16 · 16-schema · 16-&lt;sha&gt;</text>
  <text x="817" y="166" text-anchor="middle" class="t s">푸시 시 스캔 · 수명주기 정책</text>

  <rect x="32" y="200" width="200" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="132" y="228" text-anchor="middle" class="t h">로컬 PC (선택)</text>
  <text x="132" y="252" text-anchor="middle" class="m">push-ecr.sh postgres</text>
  <path d="M232,236 H583 V184" class="arrow"/>

  <!-- 실행 라인 -->
  <rect x="270" y="290" width="474" height="210" rx="12" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="284" y="312" class="t lbl">VPC · private subnet</text>

  <rect x="290" y="330" width="170" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="358" text-anchor="middle" class="t h">앱 서비스</text>
  <text x="375" y="382" text-anchor="middle" class="t s">Service Connect</text>
  <text x="375" y="402" text-anchor="middle" class="m">postgres:5432</text>
  <path d="M460,375 H496" class="arrow"/>

  <rect x="498" y="322" width="230" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="613" y="348" text-anchor="middle" class="t h">ECS Fargate Task</text>
  <text x="613" y="370" text-anchor="middle" class="m">cdi/postgres:16-schema</text>
  <text x="613" y="392" text-anchor="middle" class="t s">ARM64 · user 70:70</text>
  <text x="613" y="412" text-anchor="middle" class="t s">healthCheck · 태스크 1개 고정</text>

  <rect x="498" y="446" width="230" height="42" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="613" y="472" text-anchor="middle" class="t s">EFS 볼륨 (데이터 영속, 암호화)</text>
  <path d="M613,432 V444" class="arrow"/>

  <!-- ECR → task pull -->
  <path d="M817,182 V262 H640 V320" class="arrow"/>
  <text x="826" y="230" class="t lbl">image pull</text>

  <!-- AWS 관리형 서비스 -->
  <rect x="770" y="300" width="158" height="62" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="849" y="326" text-anchor="middle" class="t h">Secrets Manager</text>
  <text x="849" y="348" text-anchor="middle" class="m">POSTGRES_PASSWORD</text>
  <path d="M770,340 H730" class="arrow"/>

  <rect x="770" y="392" width="158" height="62" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="849" y="418" text-anchor="middle" class="t h">CloudWatch Logs</text>
  <text x="849" y="440" text-anchor="middle" class="m">/ecs/cdi-postgres</text>
  <path d="M730,410 H768" class="arrow"/>

  <text x="32" y="330" class="t s">왜 OIDC?</text>
  <text x="32" y="350" class="t s">키 유출 · 교체 걱정 없이</text>
  <text x="32" y="370" class="t s">실행마다 임시 자격증명</text>
  <text x="32" y="410" class="t s">왜 태스크 1개?</text>
  <text x="32" y="430" class="t s">두 컨테이너가 같은 데이터</text>
  <text x="32" y="450" class="t s">디렉터리에 쓰면 DB 손상</text>

  <text x="32" y="526" class="t s">운영 DB는 RDS / Aurora 권장 — 이 구성은 dev · stg · 테스트용 (백업 · 페일오버 · 패치를 직접 책임져야 하기 때문)</text>
</svg>
