<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="② 실행과 검증">
  <style>
    .t{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1f2937}
    .title{font-size:20px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:12px;fill:#4b5563}
    .ok{font-size:13px;font-weight:700;fill:#047857}
    .m{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:12px;fill:#0f172a}
    .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
    .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="960" height="420" rx="12" fill="#ffffff"/>
  <text x="32" y="42" class="t title">② 실행과 검증</text>

  <!-- .env -->
  <rect x="32" y="80" width="150" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="107" y="106" text-anchor="middle" class="t h">.env</text>
  <text x="46" y="134" class="m">DB_USER=app</text>
  <text x="46" y="154" class="m">DB_NAME=app</text>
  <text x="46" y="174" class="m">DB_PASSWORD=****</text>
  <path d="M182,135 H214" class="arrow"/>

  <!-- run.sh -->
  <rect x="216" y="80" width="190" height="110" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="311" y="106" text-anchor="middle" class="t h">run.sh postgres schema</text>
  <text x="311" y="132" text-anchor="middle" class="t s">공통 값 → DB별 변수 이름</text>
  <text x="311" y="154" text-anchor="middle" class="m">POSTGRES_PASSWORD</text>
  <text x="311" y="174" text-anchor="middle" class="m">MYSQL_ROOT_PASSWORD …</text>
  <path d="M406,135 H438" class="arrow"/>

  <!-- 컨테이너 -->
  <rect x="440" y="70" width="270" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="575" y="96" text-anchor="middle" class="t h">컨테이너 cdi-postgres-schema</text>
  <text x="460" y="126" class="t s">1. 엔트리포인트: 데이터 디렉터리가 비었나?</text>
  <text x="460" y="148" class="t s">2. 비었으면 initdb + schema/*.sql 실행</text>
  <text x="460" y="170" class="t s">3. 진짜 서버 기동 (0.0.0.0:5432)</text>
  <rect x="460" y="186" width="230" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="575" y="206" text-anchor="middle" class="t s">HEALTHCHECK</text>
  <text x="575" y="225" text-anchor="middle" class="m">starting → healthy</text>

  <!-- 포트 -->
  <text x="440" y="276" class="m">localhost:5432 ⇄ 컨테이너:5432</text>

  <!-- 볼륨 -->
  <path d="M575,250 V300" class="dash"/>
  <ellipse cx="575" cy="312" rx="110" ry="12" fill="#e0e7ff" stroke="#6366f1"/>
  <path d="M465,312 V356 A110,12 0 0 0 685,356 V312" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="575" y="340" text-anchor="middle" class="m">cdi-postgres-schema-data</text>
  <text x="575" y="390" text-anchor="middle" class="t s">named volume → 컨테이너를 지워도 데이터 유지</text>

  <path d="M710,135 H742" class="arrow"/>

  <!-- test.sh -->
  <rect x="744" y="80" width="184" height="170" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="836" y="106" text-anchor="middle" class="t h">test.sh postgres schema</text>
  <text x="760" y="136" class="t s">1. healthy 될 때까지 대기</text>
  <text x="760" y="158" class="t s">2. 컨테이너 안 클라이언트로</text>
  <text x="772" y="176" class="t s">테이블 목록 조회</text>
  <text x="760" y="198" class="t s">3. users · orders 존재 확인</text>
  <text x="836" y="232" text-anchor="middle" class="t ok">PASS: orders,users</text>

  <text x="744" y="290" class="t s">baked 변형은 볼륨을 붙이지 않는다</text>
  <text x="744" y="310" class="t s">→ 이미지 안 데이터를 그대로 사용,</text>
  <text x="744" y="330" class="t s">  컨테이너를 지우면 처음 상태로.</text>
  <text x="32" y="240" class="t s">정리: scripts/stop.sh postgres schema</text>
  <text x="32" y="260" class="t s">볼륨까지: … --purge</text>
</svg>
