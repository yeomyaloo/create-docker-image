<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="① DB별 베이스 이미지 빌드">
  <style>
    .t{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1f2937}
    .title{font-size:20px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .s{font-size:12px;fill:#4b5563}
    .m{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:12px;fill:#0f172a}
    .mw{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:12px;fill:#e2e8f0}
    .mc{font-family:Consolas,'SFMono-Regular',Menlo,monospace;font-size:12px;fill:#94a3b8}
    .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="960" height="420" rx="12" fill="#ffffff"/>
  <text x="32" y="42" class="t title">① DB별 베이스 이미지 빌드</text>

  <!-- 명령 -->
  <text x="32" y="80" class="t h">명령</text>
  <rect x="32" y="92" width="320" height="140" rx="10" fill="#0f172a"/>
  <text x="48" y="120" class="mw">$ bash scripts/build.sh postgres</text>
  <text x="48" y="148" class="mc"># 내부적으로 실행되는 것</text>
  <text x="48" y="170" class="mw">docker build \</text>
  <text x="48" y="190" class="mw">  --build-arg VERSION=16 \</text>
  <text x="48" y="210" class="mw">  -t cdi/postgres:16 databases/postgres</text>

  <path d="M352,162 H386" class="arrow"/>

  <!-- 레이어 스택 -->
  <text x="390" y="80" class="t h">이미지 = 레이어를 쌓은 것 (아래부터)</text>
  <rect x="390" y="92"  width="300" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="404" y="117" class="m">CMD postgres -c config_file=…</text>
  <rect x="390" y="138" width="300" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="404" y="163" class="m">HEALTHCHECK pg_isready -h 127.0.0.1</text>
  <rect x="390" y="184" width="300" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="404" y="209" class="m">COPY conf/postgresql.conf</text>
  <rect x="390" y="230" width="300" height="40" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="404" y="255" class="m">FROM postgres:16-alpine</text>
  <text x="680" y="255" text-anchor="end" class="t s">공식 이미지</text>
  <text x="680" y="117" text-anchor="end" class="t s">우리가 얹은 층</text>

  <path d="M690,180 H724" class="arrow"/>

  <!-- 결과 태그 -->
  <text x="728" y="80" class="t h">결과 태그</text>
  <rect x="728" y="92" width="200" height="178" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="744" y="122" class="t s">postgres</text><text x="912" y="122" text-anchor="end" class="m">cdi/postgres:16</text>
  <text x="744" y="154" class="t s">mysql</text><text x="912" y="154" text-anchor="end" class="m">cdi/mysql:8.4</text>
  <text x="744" y="186" class="t s">mariadb</text><text x="912" y="186" text-anchor="end" class="m">cdi/mariadb:11.4</text>
  <text x="744" y="218" class="t s">mongodb</text><text x="912" y="218" text-anchor="end" class="m">cdi/mongodb:7.0</text>
  <text x="744" y="250" class="t s">redis</text><text x="912" y="250" text-anchor="end" class="m">cdi/redis:7.4</text>

  <!-- 설계 이유 -->
  <rect x="32" y="300" width="896" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="326" class="t h">왜 이렇게?</text>
  <text x="48" y="350" class="t s">• 공식 이미지 위에 얹는다 → 초기화·권한 강등·시그널 처리 같은 엔트리포인트를 그대로 재사용, 우리는 설정과 헬스체크만 책임진다.</text>
  <text x="48" y="370" class="t s">• 버전은 scripts/lib.sh 한 곳에서 관리 → FROM 버전과 이미지 태그가 어긋나지 않는다.</text>
  <text x="48" y="390" class="t s">• 헬스체크는 127.0.0.1(TCP)로 확인 → 초기화용 임시 서버(소켓 전용)가 떠 있는 동안 healthy 로 오판하지 않는다.</text>
</svg>
